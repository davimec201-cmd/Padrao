# Blueprint do Render. No painel: New → Blueprint → escolher este repositório.
# As duas variáveis marcadas com sync: false são pedidas na hora do deploy.
services:
  - type: web
    name: diagramador-teaformation
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /saude
    autoDeployTrigger: commit
    envVars:
      - key: SENHA_APP
        sync: false          # a senha para entrar no app
      - key: ANTHROPIC_API_KEY
        sync: false          # classificação dos trechos sem diretiva
      - key: CHAVE_SESSAO
        generateValue: true  # assina o cookie de sessão
      - key: PORT
        value: 10000
